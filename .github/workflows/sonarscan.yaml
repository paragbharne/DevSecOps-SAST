name: DAST with Zap
on:
  workflow_dispatch:       
  push:
    branches:
      - main
      - master
      - image
      - dast
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    name: OWASP ZAP Full Scan
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: dast

    - name: ZAP Scan
      id: zap_scan
      uses: zaproxy/action-full-scan@v0.12.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
        target: 'https://juice-shop.herokuapp.com'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'

    - name: Upload ZAP HTML Report
      uses: actions/upload-artifact@v4
      with:
        name: zap-html-report
        path: report_html.html


    - name: Show ZAP Summary in GitHub Actions
      if: always() # Ensure this runs even if scan fails
      run: |
        echo "## 🔍 ZAP Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Target: https://www.zaproxy.org/" >> $GITHUB_STEP_SUMMARY
        echo "- Scan Type: Full Scan" >> $GITHUB_STEP_SUMMARY
        echo "- [Download HTML Report](./zap-html-report/report_html.html)" >> $GITHUB_STEP_SUMMARY
        echo "View report online: https://your-org.github.io/zap-report.html" >> $GITHUB_STEP_SUMMARY



        
