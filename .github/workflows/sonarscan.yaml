name: Docker Image Hardening
on:
  workflow_dispatch:       
  push:
    branches:
      - main
      - master
      - image
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - name: 🧾 Checkout Code
      uses: actions/checkout@v3

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🔐 Enable Docker Content Trust
      run: echo "DOCKER_CONTENT_TRUST=1" >> $GITHUB_ENV

    - name: 📦 Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-docker-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-docker-

    - name: 🐳 Build Hardened Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        load: true
        tags: hardened-flask-app:latest
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache

    - name: 🧪 Test Container (Optional)
      run: docker run --rm hardened-flask-app python --version

    - name: 📜 Generate SBOM with Syft
      uses: anchore/sbom-action@v0.14.3
      with:
        image: hardened-flask-app:latest
        output-file: sbom.spdx.json

    - name: 🔍 Vulnerability Scan (Snyk CLI)
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: hardened-flask-app:latest
        args: --severity-threshold=medium